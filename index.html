<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Number Game Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #00ff88; margin-bottom: 5px; }
        .balance-card { background: linear-gradient(135deg, #11998e, #38ef7d); padding: 15px; border-radius: 10px; margin: 15px 0; font-size: 18px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; max-height: 200px; overflow-y: auto; padding: 5px; background: #111; border-radius: 8px; }
        .num-btn { background: #333; color: white; border: none; padding: 12px 0; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .num-btn.selected { background: #00ff88; color: black; }
        input, button.action-btn { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 16px; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; }
        button.action-btn { background: #00ff88; color: black; font-weight: bold; cursor: pointer; }
        .deposit-section { background: #252525; padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid #333; }
        .withdraw-btn { background: #ff3b30 !important; color: white !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔢 Virtual Draw Arena</h1>
    
    <!-- WALLET DISPLAY IN ETB -->
    <div class="balance-card">
        Dashboard Balance: <span id="wallet-balance">0</span> ETB
        <div style="font-size: 12px; margin-top: 5px; color: #e0e0e0;">
            Total Wins: <span id="stats-won">0</span> ETB | Total Losses: <span id="stats-lost">0</span> ETB
        </div>
    </div>

    <input type="text" id="player-phone" placeholder="Enter Your Phone Number (09...)" required>
    <button class="action-btn" onclick="loadDashboard()">Load My Dashboard</button>
    
    <!-- DEPOSIT SECTION (ONCE) -->
    <div class="deposit-section">
        <h4 style="margin: 0 0 10px 0; color: #00ff88;">💰 Deposit Balance to Wallet</h4>
        <input type="number" id="deposit-amount" placeholder="Amount to Deposit (ETB)">
        <input type="text" id="screenshot-url" placeholder="Paste Payment Receipt Screenshot URL">
        <button class="action-btn" style="background: #38ef7d;" onclick="submitDeposit()">Submit Deposit Receipt</button>
    </div>

    <hr style="border-color: #333; margin: 20px 0;">

    <h3>Pick Your 3 Numbers for the Round:</h3>
    <div class="grid" id="number-grid"></div>
    <p id="selection-status" style="color:#00ff88; font-size:14px; font-weight:bold;"></p>

    <!-- RANGE PLAY SECTION -->
    <input type="number" id="bet-amount" placeholder="Choose Round Bet Amount (5 - 300 ETB)" min="5" max="300">
    <button class="action-btn" onclick="playRound()">Confirm & Play Round</button>
    
    <button class="action-btn withdraw-btn" onclick="requestWithdrawal()">Request Cash Withdrawal</button>
</div>

<script>
    // Replace with your exact live web service URL link from your Render service dashboard!
    const BACKEND_URL = "https://onrender.com"; 
    let selectedNumbers = [];

    // Initialize number grid
    const grid = document.getElementById('number-grid');
    for (let i = 1; i <= 100; i++) {
        let btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => toggleNumber(i, btn);
        grid.appendChild(btn);
    }

    function toggleNumber(num, btn) {
        if (selectedNumbers.includes(num)) {
            selectedNumbers = selectedNumbers.filter(n => n !== num);
            btn.classList.remove('selected');
        } else {
            if (selectedNumbers.length >= 3) return alert("You can only choose exactly 3 numbers!");
            selectedNumbers.push(num);
            btn.classList.add('selected');
        }
        document.getElementById('selection-status').innerText = `Selected: ${selectedNumbers.join(', ')}`;
    }

    async function loadDashboard() {
        const phone = document.getElementById('player-phone').value;
        if (!phone) return alert("Type your phone number first!");
        try {
            const res = await fetch(`${BACKEND_URL}/api/dashboard/${phone}`);
            const data = await res.json();
            document.getElementById('wallet-balance').innerText = data.balance || 0;
            document.getElementById('stats-won').innerText = data.total_won || 0;
            document.getElementById('stats-lost').innerText = data.total_lost || 0;
        } catch (err) {
            alert("Syncing server... click load again in a few seconds.");
        }
    }

    async function submitDeposit() {
        const phone = document.getElementById('player-phone').value;
        const amount = document.getElementById('deposit-amount').value;
        const screenshot = document.getElementById('screenshot-url').value;

        if (!phone || !amount || !screenshot) return alert("Fill out the deposit fields completely!");

        const response = await fetch(`${BACKEND_URL}/api/deposit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phoneNumber: phone, amount: parseInt(amount), screenshotUrl: screenshot })
        });
        const result = await response.json();
        alert(result.message);
    }

    async function playRound() {
        const phone = document.getElementById('player-phone').value;
        const bet = document.getElementById('bet-amount').value;

        if (!phone || selectedNumbers.length !== 3 || !bet) {
            return alert("Select your account profile phone number, choose 3 numbers, and input your bet amount!");
        }

        const response = await fetch(`${BACKEND_URL}/api/play-round`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phoneNumber: phone, chosenNumbers: selectedNumbers, betAmount: parseInt(bet) })
        });
        const result = await response.json();
        if (result.error) {
            alert(result.error);
        } else {
            alert(result.message);
            document.getElementById('wallet-balance').innerText = result.currentBalance;
            loadDashboard(); // Refresh matching win/loss metrics panels
        }
    }

    async function requestWithdrawal() {
        const phone = document.getElementById('player-phone').value;
        const amount = prompt("Enter amount to withdraw in ETB:");
        if (!phone || !amount) return;

        const response = await fetch(`${BACKEND_URL}/api/request-withdrawal`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phoneNumber: phone, amount: parseInt(amount) })
        });
        const result = await response.json();
        alert(result.message || result.error);
        loadDashboard();
    }
</script>
</body>
</html>
